[package]
name = "mastersafe"
version = "7.10.6"
description = "MasterSafe - cofre pessoal criptografado"
authors = ["MasterSafe"]
edition = "2021"

[lib]
name = "mastersafe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"